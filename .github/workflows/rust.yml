name: Rust

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust-check:
    name: rust-check
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    # The schema tests skip when DATABASE_URL is unset, so CI must provide one
    # or the constraints this repository relies on would go unverified.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sandbox
          POSTGRES_PASSWORD: sandbox
          POSTGRES_DB: sandbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sandbox -d sandbox"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      DATABASE_URL: postgres://sandbox:sandbox@127.0.0.1:5432/sandbox

    steps:
      - name: Check out proposed changes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # rust-toolchain.toml pins the version; this only reports what it
      # resolved to, so a failure is legible in the log.
      - name: Show toolchain
        run: |
          rustup show active-toolchain
          cargo --version

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          protoc --version

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # Ordinary unprivileged object storage, never a KVM/host integration test.
      # Pin the upstream multi-architecture release, not a mutable latest tag.
      - name: Start private test object storage
        run: |
          docker run -d --name hudson-output-minio -p 127.0.0.1:59000:9000 \
            -e MINIO_ROOT_USER=sandbox -e MINIO_ROOT_PASSWORD=sandbox-dev-secret \
            quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e \
            server /data
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:59000/minio/health/live > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:59000/minio/health/live > /dev/null
          docker exec hudson-output-minio sh -c \
            'MC_HOST_hudson="http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@127.0.0.1:9000" mc mb hudson/hudson-output-test'

      - name: Verify S3 conditional output writes and reads
        env:
          HUDSON_TEST_S3_ENDPOINT: http://127.0.0.1:59000
          HUDSON_TEST_S3_BUCKET: hudson-output-test
          HUDSON_TEST_S3_ACCESS_KEY: sandbox
          HUDSON_TEST_S3_SECRET_KEY: sandbox-dev-secret
        run: cargo test -p sandbox-artifacts output_minio -- --ignored

      - name: Remove test object storage
        if: always()
        run: docker rm -f hudson-output-minio || true

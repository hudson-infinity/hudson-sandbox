# Local development dependencies. Not a deployment topology — see
# docs/implementation/dev-env.md.
#
# Ports are deliberately off the defaults. A developer with PostgreSQL already
# installed will otherwise have the container bind :: while 127.0.0.1 stays
# with their native server, and every connection from the host silently
# reaches the wrong database. That failure looks like a missing role, not a
# port conflict, so it is worth avoiding by construction.
name: hudson-sandbox-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sandbox
      POSTGRES_PASSWORD: sandbox
      POSTGRES_DB: sandbox
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sandbox -d sandbox"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    # Docker Hub's minio/minio is no longer pullable anonymously; quay.io is
    # the working source.
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sandbox
      MINIO_ROOT_PASSWORD: sandbox-dev-secret
    ports:
      - "59000:9000"
      - "59001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
  minio-data:

# Dedicated aarch64 development host, not the supported x86_64 release test environment.
# Plain mode disables host mounts, application port forwarding, and container tooling.
minimumLimaVersion: 2.2.0
vmType: vz
arch: aarch64
nestedVirtualization: true
cpus: 4
memory: 4GiB
disk: 24GiB
plain: true
mounts: []
propagateProxyEnv: false
ssh:
  loadDotSSHPubKeys: false
  forwardAgent: false
  forwardX11: false
images:
- location: https://cloud-images.ubuntu.com/releases/noble/release-20260705/ubuntu-24.04-server-cloudimg-arm64.img
  arch: aarch64
  digest: sha256:7df0201546f75b8bcc1044594c806c35749421ad3c9bc1be2a3ab806cfae39cc

syntax = "proto3";
package hudson.guest.v1;

// One request/response per mutually authenticated TLS connection, framed by a
// four-byte big-endian length. Never reuse deleted field numbers.
message Context { string allocation_id = 1; int64 generation = 2; string boot_id = 3; }
message Hello {}
message Operation { string operation_id = 1; }
message Execute {
  string operation_id = 1;
  repeated string argv = 2;
  map<string, string> env = 3;
  string cwd = 4;
  int64 deadline_unix_ms = 5;
  uint64 output_limit = 6;
}
enum Stream { STREAM_UNSPECIFIED = 0; STREAM_STDOUT = 1; STREAM_STDERR = 2; }
message ReadOutput { string operation_id = 1; Stream stream = 2; uint64 offset = 3; uint32 limit = 4; }
message Request {
  uint32 version = 1;
  string request_id = 2;
  Context context = 3;
  oneof action { Hello hello = 4; Execute execute = 5; Operation inspect = 6; Operation cancel = 7; ReadOutput output = 8;
    FileUpload begin_upload = 9; WriteFile write_file = 10; FileOperation inspect_upload = 11;
    FileOperation commit_upload = 12; FileOperation abort_upload = 13; CaptureFile capture_file = 14;
    ReadFile read_file = 15; FileHandle release_file = 16; HistoryBarrier retire_history = 17;
  }
}
enum State { STATE_UNSPECIFIED = 0; STATE_LAUNCH_INTENT = 1; STATE_EXITED = 2; STATE_TIMED_OUT = 3; STATE_CANCELLED = 4; STATE_UNKNOWN = 5; }
message OutputStats { uint64 seen = 1; uint64 stored = 2; bool truncated = 3; }
message Receipt {
  uint32 version = 1;
  Context context = 2;
  string operation_id = 3;
  bytes digest = 4;
  State state = 5;
  int64 deadline_unix_ms = 6;
  uint64 output_limit = 7;
  bool cancel_requested = 8;
  bool cleanup_confirmed = 9;
  optional int32 exit_code = 10;
  optional int32 signal = 11;
  OutputStats stdout = 12;
  OutputStats stderr = 13;
  optional string reason = 14;
}
message OutputChunk {
  string operation_id = 1; Stream stream = 2; uint64 offset = 3;
  bytes data = 4; uint64 next_offset = 5; bool at_end = 6; bool complete = 7;
}
enum ErrorCode { ERROR_CODE_UNSPECIFIED = 0; ERROR_CODE_INVALID = 1; ERROR_CODE_NOT_FOUND = 2; ERROR_CODE_REJECTED = 3; ERROR_CODE_UNCERTAIN = 4; }
message Error { ErrorCode code = 1; }
message Response {
  uint32 version = 1; string request_id = 2; Context context = 3;
  oneof result { Hello hello = 4; Receipt receipt = 5; OutputChunk output = 6; Error error = 7;
    FileReceipt file_receipt = 8; FileProgress file_progress = 9; FileCapture file_capture = 10;
    FileChunk file_chunk = 11; FileHandle file_released = 12; HistoryBarrier history_retired = 13;
  }
}

// File bytes remain bounded chunks. Upload IDs are durable operations; capture IDs
// are fresh guest-generated read handles and are never recaptured by a range read.
message FileUpload {
  string operation_id = 1; string path = 2; uint64 size = 3; bytes sha256 = 4; uint32 mode = 5;
}
message FileOperation { string operation_id = 1; bytes digest = 2; }
message WriteFile { FileOperation operation = 1; uint64 offset = 2; bytes data = 3; }
enum FileState {
  FILE_STATE_UNSPECIFIED = 0; FILE_STATE_STAGING = 1; FILE_STATE_COMMIT_INTENT = 2;
  FILE_STATE_COMMITTED = 3; FILE_STATE_UNKNOWN = 4; FILE_STATE_ABORTED = 5;
}
message FileReceipt {
  uint32 version = 1; Context context = 2; FileUpload upload = 3; bytes digest = 4; FileState state = 5;
}
message FileProgress { FileOperation operation = 1; uint64 stored = 2; }
message CaptureFile { string path = 1; }
message FileCapture {
  string capture_id = 1; string path = 2; uint64 size = 3; bytes sha256 = 4; int64 expires_unix_ms = 5;
}
message FileHandle { string capture_id = 1; bytes sha256 = 2; }
message ReadFile { FileHandle handle = 1; uint64 offset = 2; uint32 limit = 3; }
message FileChunk {
  FileHandle handle = 1; uint64 offset = 2; bytes data = 3; uint64 next_offset = 4;
  uint64 size = 5; bool at_end = 6;
}

// Successful reply acknowledges synced deletion, not merely installation of a floor.
enum HistoryDomain { HISTORY_DOMAIN_UNSPECIFIED = 0; HISTORY_DOMAIN_COMMANDS = 1; HISTORY_DOMAIN_FILES = 2; }
message HistoryBarrier { uint32 version = 1; Context context = 2; HistoryDomain domain = 3; string through = 4; }
